simulation:
  num_sats: 5
  num_uavs: 3
  num_ground: 4
  num_clients: 5
  area_size: 2000
  gradient_dim: 100
  sigma2: 10
  algorithm: test

  # Dynamic Simulation Parameters
  duration_hours: 0.5         # Total simulation time
  time_step_seconds: 10       # Inner loop execution frequency (Fast timescale)
  outer_interval_minutes: 30  # Outer loop execution frequency (Slow timescale)

algorithm:
  alpha: 0.5
  beta: 0.5
  budget: 20
  delta_list:
    - 0.1
    - 0.2
  snr_threshold: 0.0
  target_snr: 10.0          # Used by the Inner Loop power control

gnn:
  checkpoint: checkpoints/sagin_hgnn.pt
  kappa: 0.15